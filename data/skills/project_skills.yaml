# USAGE INSTRUCTIONS
# =======================
#
# In posts about projects, reference skills like:
#
# frontmatter:
#   title: "Construction d'une école à Dorool"
#   projects: ["école", "fournitures"]
#   villages: ["dorool"]
#   categories: ["Éducation"]
#
# In village pages, list active projects:
#
# frontmatter:
#   title: "Village de Dorool"
#   active_projects:
#     - école
#     - formation
#     - fournitures
#
# This ensures consistency across all project documentation.
