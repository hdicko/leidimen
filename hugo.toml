    dir = ':cacheDir/images'

# Media types configuration for audio files
[mediaTypes]
  [mediaTypes."audio/mpeg"]
    suffixes = ["mp3"]
  [mediaTypes."audio/aac"]
    suffixes = ["aac"]
  [mediaTypes."audio/ogg"]
    suffixes = ["ogg"]
  [mediaTypes."audio/wav"]
    suffixes = ["wav"]
    

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'assets'

# Minification configuration
# Disable JS minification to preserve ES6 syntax (arrow functions, spread operators)
# HTML and CSS minification remain enabled for better performance
[minify]
  disableJS = true
  disableCSS = false
  disableHTML = false
  disableJSON = false
  disableSVG = false
  minifyOutput = true
  
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepDefaultAttrVals = true
      keepDocumentTags = true
      keepEndTags = true
      keepQuotes = true
      keepWhitespace = false
    [minify.tdewolff.css]
      precision = 1
      version = 4

# Build configuration for performance
[build]
  writeStats = true
  useResourceCacheWhen = "fallback"
  disableXML = false
