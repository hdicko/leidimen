backend:
  name: git-gateway
  branch: main

# when using the default proxy server port
local_backend: true
media_folder: "static/img"
public_folder: "/img"

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Auteur", name: "author", widget: "string", default: "Leidimen"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Catégories", name: "categories", widget: "list", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Brouillon", name: "draft", widget: "boolean", default: false}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "about"
    label: "Équipe"
    folder: "content/about"
    path: "{{slug}}/index"
    media_folder: "images"
    public_folder: "images"
    create: true
    fields:
      - {label: "Nom", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Poste", name: "job", widget: "string", required: false}
      - {label: "Email", name: "email", widget: "string", required: false}
      - {label: "Téléphone", name: "phone", widget: "string", required: false}
      - {label: "Bio courte", name: "bio", widget: "text", required: false}
      - {label: "Compétences", name: "skills", widget: "list", required: false}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "villages"
    label: "Villages"
    folder: "content/villages"
    path: "{{slug}}/index"
    media_folder: "images"
    public_folder: "images"
    create: true
    fields:
      - {label: "Nom du village", name: "title", widget: "string"}
      - {label: "Population", name: "population", widget: "number", required: false}
      - {label: "Région", name: "region", widget: "string", default: "Douentza"}
      - {label: "Description courte", name: "description", widget: "text"}
      - {label: "Photos", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}, required: false}
      - {label: "Projets", name: "projects", widget: "list", required: false}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "team"
    label: "Équipe"
    folder: "content/about"
    create: true
    slug: "{{slug}}"
    media_folder: "images"
    public_folder: "images"
    fields:
      - {label: "Nom complet", name: "title", widget: "string"}
      - {label: "Date d'ajout", name: "date", widget: "datetime", default: "{{now}}"}
      - {label: "Photo", name: "card.image", widget: "image", required: false}
      - {label: "Fonction", name: "card.fonction", widget: "string"}
      - {label: "Statut", name: "card.membre", widget: "select", options: ["fondateur", "bureau", "adherent", "bienfaiteur"], default: "adherent"}
      - {label: "Ville", name: "card.ville", widget: "string"}
      - {label: "Pays", name: "card.pays", widget: "string", default: "France"}
      - {label: "Email", name: "card.email", widget: "string", required: false}
      - {label: "Téléphone", name: "card.tel", widget: "string", required: false}
      - {label: "LinkedIn", name: "card.linkedin", widget: "string", required: false}
      - {label: "Spécialités", name: "card.specialites", widget: "list", required: false}
      - {label: "Catégories", name: "categories", widget: "list", options: ["CA", "Bureau", "Membres"], required: false}
      - {label: "Biography", name: "body", widget: "markdown"}

  - name: "documents"
    label: "Documents"
    folder: "content/documents"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Type", name: "type", widget: "select", options: ["Rapport", "Politique", "Guide", "Formulaire", "Compte-rendu"]}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Fichier PDF", name: "file", widget: "file", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "galleries"
    label: "Galeries"
    folder: "content/galleries"
    path: "{{slug}}/index"
    media_folder: "images"
    public_folder: "images"
    create: true
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Lieu", name: "location", widget: "string", required: false}
      - {label: "Photos", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages principales"
    files:
      - label: "Page d'accueil"
        name: "home"
        file: "content/_index.md"
        fields:
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "config"
    label: "Configuration"
    editor:
      preview: false
    files:
      - label: "Configuration générale"
        name: "hugo"
        file: "hugo.toml"
        fields:
          - {label: "URL de base", name: "baseURL", widget: "string"}
          - {label: "Titre du site", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string"}
          - {label: "Langue", name: "languageCode", widget: "string", default: "fr-fr"}
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/_index.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Blurb", name: "blurb", widget: "text" }
          - {
              label: "Section",
              name: "section",
              widget: "object",
              fields:
                [
                  { label: "Heading", name: "heading", widget: string },
                  { label: "Text", name: "text", widget: "text" },
                ],
            }
      - file: "content/about/hamadoun.md"
        label: "Hamadoun"
        name: "hamadoun"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }
          - {
              label: "Card",
              name: "card",
              widget: "object",
              fields:
                [
                  { label: "devise", name: "devise", widget: string },
                  { label: "membre", name: "membre", widget: "text" },
                ],
            }
      - file: "/Documents/"
        label: "Documents"
        name: ""
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Description"
            name: "description"
            widget: "string"
          - label: "Image"
            name: "image"
            widget: "image"
            choose_url: true
            media_library:
              config:
                multiple: true
                media_folder: "documents"
