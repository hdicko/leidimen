{{ $data := .Data }}
<div class="container-flex mt-3" role="main">
  <div
    class="col-lg-8 mx-auto col-md-10 offset-md-1 border border-success border-5 rounded-5">
    <article class="post-preview">
      <div class="accordion" id="accordion">
        {{ range $key, $value := .Data.Terms.ByCount }}
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingOne">
              <button
                class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapse{{ $value.Name }}">
                <h4 class="accordion-header ms-2">
                  {{ $value.Name }}
                  <span
                    class="badge rounded-pill text-bg-light position-absolute text-end"
                    >{{ $value.Count }}</span
                  >
                </h4>
              </button>
            </h2>
            <div
              id="collapse{{ $value.Name }}"
              class="accordion-collapse collapse">
              <div class="accordion-body">
                <a
                  href="{{ $value.Page.RelPermalink }}"
                  class="post-title list-group-item view-all"
                  >View all</a
                >
                <div class="list-group">
                  {{ range $item := $value.WeightedPages }}
                    <a href="{{ $item.Permalink }}" class="list-group-item"
                      >{{ $item.Title }}</a
                    >
                  {{ end }}
                </div>
              </div>
            </div>
          </div>
        {{ end }}
      </div>
    </article>
  </div>
</div>
