<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div class="container my-5">
  <div class="map-header text-center mb-4">
    <h3>
      <i class="bi bi-geo-alt-fill"></i>
      Localisation des villages d'intervention
    </h3>
  </div>
  
  <div id="villages-map" style="height: 500px; width: 100%;"></div>
  
  <div class="map-footer text-center mt-3">
    <span class="text-muted">
      <i class="bi bi-info-circle me-2"></i>
      Cliquez sur les marqueurs pour voir les détails de chaque village
    </span>
  </div>
</div>

<script>
(function() {
  // Wait for Leaflet to load
  function initMap() {
    if (typeof L === 'undefined') {
      setTimeout(initMap, 100);
      return;
    }

    // Initialiser la carte centrée sur la région de Douentza
    const map = L.map('villages-map').setView([15.1, -2.95], 10);
    // Ajouter le fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    }).addTo(map);
    
    // Données des villages depuis Hugo
    const villages = [
      {{ range $index, $village := $.Site.Data.villages.mali_villages }}
      {
        name: "{{ $village.name }}",
        lat: {{ $village.latitude }},
        lon: {{ $village.longitude }},
        type: "{{ $village.type }}",
        description: "{{ $village.description }}",
        population: {{ $village.population | default 0 }},
        projects: [{{ range $village.projects }}"{{ . }}",{{ end }}]
      }{{ if ne $index (sub (len $.Site.Data.villages.mali_villages) 1) }},{{ end }}
      {{ end }}
    ];
    
    // Icônes personnalisées pour les différents types
    const chefLieuIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
    
    const villageIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
    
    // Ajouter les marqueurs pour chaque village
    villages.forEach(village => {
      const icon = village.type === 'chef-lieu' ? chefLieuIcon : villageIcon;
      
      const popupContent = `
        <div>
          <h6>${village.name}</h6>
          <p><strong>Population:</strong> ${village.population.toLocaleString()} habitants</p>
          <p><strong>Description:</strong> ${village.description}</p>
          ${village.projects.length > 0 ? `<p><strong>Projets:</strong> ${village.projects.join(', ')}</p>` : ''}
          <span class="badge ${village.type === 'chef-lieu' ? 'bg-primary' : 'bg-success'}">${village.type === 'chef-lieu' ? 'Chef-lieu' : 'Village'}</span>
        </div>
      `;
      
      const marker = L.marker([village.lat, village.lon], { icon: icon })
        .bindPopup(popupContent)
        .addTo(map);
      
      // Ajouter un label permanent avec le nom du village
      marker.bindTooltip(village.name, {
        permanent: true,
        direction: 'top',
        offset: [0, -35]
      });
    });
  }
  
  initMap();
})();
</script>
