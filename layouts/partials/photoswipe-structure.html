<!--
  PhotoSwipe HTML Structure Partial
  
  Purpose: Provides the PhotoSwipe lightbox DOM structure
  Used by: gallery.html, load-photoswipe.html
  
  Structure:
  - Root container (.pswp) with proper ARIA attributes
  - Background overlay (.pswp__bg)
  - Slides wrapper (.pswp__scroll-wrap)
  - Slide containers (.pswp__item x3 - PhotoSwipe keeps only 3 in DOM)
  - UI controls (close, share, fullscreen, zoom)
  - Navigation arrows (left/right)
  - Image counter and caption area
  
  Note: This structure must remain unchanged as PhotoSwipe relies on these
  specific class names and DOM hierarchy. Only modify if you know what you're doing.
  
  Documentation: https://photoswipe.com/documentation/getting-started.html
-->

<!-- Root element of PhotoSwipe -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
  <!-- Background overlay - Separate element for faster opacity animation -->
  <div class="pswp__bg"></div>

  <!-- Slides wrapper with overflow:hidden -->
  <div class="pswp__scroll-wrap">
    <!-- Container that holds slides - PhotoSwipe keeps only 3 in DOM for memory efficiency -->
    <div class="pswp__container">
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
    </div>

    <!-- PhotoSwipe UI controls -->
    <div class="pswp__ui pswp__ui--hidden">
      <!-- Top bar with controls -->
      <div class="pswp__top-bar">
        <!-- Image counter (e.g., "1 of 10") -->
        <div class="pswp__counter"></div>

        <!-- Control buttons -->
        <button
          class="pswp__button pswp__button--close"
          title="Close (Esc)"></button>
        <button class="pswp__button pswp__button--share" title="Share"></button>
        <button
          class="pswp__button pswp__button--fs"
          title="Toggle fullscreen"></button>
        <button
          class="pswp__button pswp__button--zoom"
          title="Zoom in/out"></button>

        <!-- Loading preloader -->
        <div class="pswp__preloader">
          <div class="pswp__preloader__icn">
            <div class="pswp__preloader__cut">
              <div class="pswp__preloader__donut"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Share modal (hidden by default) -->
      <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
        <div class="pswp__share-tooltip"></div>
      </div>

      <!-- Navigation arrows -->
      <button
        class="pswp__button pswp__button--arrow--left"
        title="Previous (arrow left)"></button>
      <button
        class="pswp__button pswp__button--arrow--right"
        title="Next (arrow right)"></button>

      <!-- Image caption area -->
      <div class="pswp__caption">
        <div class="pswp__caption__center"></div>
      </div>
    </div>
  </div>
</div>
