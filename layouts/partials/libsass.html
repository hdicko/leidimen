{{ with resources.Get "scss/index.scss" }}
  {{ $opts := dict "transpiler" "dartsass" "targetPath" "css/leidimen.css" }}
  {{ with . | toCSS $opts | minify | fingerprint }}
    <link
      rel="stylesheet"
      href="{{ .RelPermalink }}"
      integrity="{{ .Data.Integrity }}"
      crossorigin="anonymous" />
  {{ end }}
{{ end }}
