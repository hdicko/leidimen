{{/** videos **/}}
<div class="container text-center">
  <div class="row justify-content-center">
    {{ with .Resources.ByType "video" }}
    <h1 class="text-center fs-4 mb-1 mt-5">
      <mark>Quelques videos</mark>
    </h1>
    {{ range . }} {{ $video := . }}
    <div class="col-12 col-md-6 d-flex justify-content-center mb-3">
      <div class="p-3">
        <video class="object-fit-fill" controls poster="image.png" width="320">
          <source src="{{ $video.RelPermalink }}" type="video/mp4" />
        </video>
      </div>
    </div>
    {{ end }} {{ end }}
  </div>
</div>
